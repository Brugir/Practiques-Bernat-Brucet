<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca CRUD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Biblioteca de Clásicos</h1>
    
    <!-- Formulario de Login -->
    <div id="login-form-container">
        <h2>Iniciar sesión</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Nombre de usuario" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Iniciar sesión</button>
        </form>
        <p id="login-message"></p>
    </div>

    <!-- Tabla de Libros, mostrada solo después de iniciar sesión -->
    <div id="book-table-container" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Año</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="book-table"></tbody>
        </table>

        <form id="book-form" style="display: none;">
            <input type="hidden" id="book-id">
            <input type="text" id="book-title" placeholder="Título" required>
            <input type="text" id="book-author" placeholder="Autor" required>
            <input type="number" id="book-year" placeholder="Año" required>
            <button type="button" id="createButton">AÑADIR LIBRO</button>
        </form>
        <button type="button" id="downloadButton" style="display: none;">DOWNLOAD</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
