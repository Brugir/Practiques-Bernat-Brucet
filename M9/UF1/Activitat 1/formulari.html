<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        <ul>
            <li>
                <label>Nombre</label>
                <input type="text" id="name" name="user_name" maxlength="20" required autofocus placeholder="Esribe tu nombre"/>
            </li>
            <li>
                <label>Apellidos</label>
                <input type="text" id="username" name="user_username" required placeholder="Escribe tus apellidos"/>
            </li>
            <li>
                <label>Documento de intedidad</label>
                <input type="text" id="identity_document" pattern="\d{7,8}" required placeholder="Escribe tu identidad"/>
            </li>
            <li>
                <label>Edad</label>
                <input type="number" id="age" min="0" max="100" placeholder="Escribe tu edad"/>
            </li>
            <li>
                <label>Data de nacimiento</label>
                <input type="date" id="nacimiento" placeholder="Escribe tu data de nacimiento">            
            </li>
            <li>
                <label for="email">Correo electronico</label>
                <input type="email" id="mail" name="user_mail" placeholder="Escribe tu email"/>
            </li>
            <li>
                <label>Contraseña</label>
                <input type="password" required placeholder="escribe tu contraseña">
            </li>
            <li>
                <label for="msg">Mensaje:</label>
                <textarea id="msg" name="user_message" placeholder="Escribe tu mensaje"></textarea>
            </li>
            <li>
                <label for="photo_dni">Foto del dni</label>
                <input type="file" name="photos" accept="image/*" id="photo" multiple placeholder="Añade tus fotos aqui, puedes añador hasta 2"/>
            </li>
            </ul>
    </form>
</body>
</html>
