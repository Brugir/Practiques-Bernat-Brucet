<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400">
        <!-- Fondo -->
        <rect width="400" height="400" fill="skyblue"/>
        <!-- Césped -->
        <rect y="300" width="400" height="100" fill="lightgreen"/>
        <!-- Sol -->
        <circle cx="350" cy="50" r="30" fill="yellow"/>
        <!-- Casa -->
        <rect x="125" y="150" width="150" height="150" fill="peachpuff"/>       
        <!-- Techo -->
        <polygon points="125,150 200,100 275,150" fill="saddlebrown"/>
        <!-- Puerta -->
        <rect x="180" y="220" width="40" height="80" fill="brown"/>
        <circle cx="215" cy="260" r="3" fill="yellow"/>
        <!-- Ventanas -->
        <rect x="140" y="170" width="40" height="40" fill="white"/>
        <rect x="220" y="170" width="40" height="40" fill="white"/>
    </svg>

    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400">
        <!-- Fondo -->
        <rect width="400" height="400" fill="lightgray"/>
        <!-- Cuerpo del coche -->
        <rect x="100" y="200" width="200" height="60" fill="red"/>
        <rect x="140" y="160" width="120" height="60" fill="red"/>
        <!-- Ventanas -->
        <rect x="150" y="170" width="40" height="30" fill="skyblue"/>
        <rect x="210" y="170" width="40" height="30" fill="skyblue"/>
        <!-- Llantas -->
        <circle cx="150" cy="270" r="20" fill="black"/>
        <circle cx="150" cy="270" r="10" fill="gray"/>
        <circle cx="250" cy="270" r="20" fill="black"/>
        <circle cx="250" cy="270" r="10" fill="gray"/>
        <!-- Luces -->
        <rect x="90" y="220" width="10" height="20" fill="yellow"/>
        <rect x="300" y="220" width="10" height="20" fill="yellow"/>
    </svg>

      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400">
        <!-- Fondo -->
        <rect width="400" height="400" fill="lightgray"/>
        
        <!-- Cabeza -->
        <rect x="150" y="100" width="100" height="70" fill="silver" />
        <!-- Ojos -->
        <circle cx="175" cy="130" r="15" fill="lime" />
        <circle cx="225" cy="130" r="15" fill="lime" />
        <circle cx="175" cy="130" r="6" fill="white" />
        <circle cx="225" cy="130" r="6" fill="white" />
        <!-- Antena -->
        <line x1="200" y1="100" x2="200" y2="70" stroke="silver" stroke-width="8" />
        <circle cx="200" cy="60" r="10" fill="red" />
        
        <!-- Cuerpo -->
        <rect x="170" y="170" width="60" height="100" fill="silver" />
        <!-- Botones -->
        <circle cx="200" cy="200" r="8" fill="red" />
        <circle cx="200" cy="220" r="8" fill="lime" />
        <circle cx="200" cy="240" r="8" fill="blue" />
        
        <!-- Brazos -->
        <rect x="120" y="190" width="40" height="20" fill="silver" />
        <rect x="240" y="190" width="40" height="20" fill="silver" />
      </svg>
      
      
<!-- 
  
Les imatges vectorials es basen en fòrmules matemàtiques que defineixen la posició 
de la forma i els atributs dels objectes gràfics (color, línees, punts, etc…).

El de mapa de bits estàm compostes per píxeles, que es combinant-se, formen una imatge.

La prinicpal diferència es que quan fas zoom a un arxiu svg, no es veurà pixelat, 
mentres tant, el del mapa de píxels, si 

-->
